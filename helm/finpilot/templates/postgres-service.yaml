{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: finpilot-postgres
  labels:
    app.kubernetes.io/component: database
    {{- include "finpilot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    app.kubernetes.io/component: database
    app.kubernetes.io/name: {{ include "finpilot.name" . }}
{{- end }}
