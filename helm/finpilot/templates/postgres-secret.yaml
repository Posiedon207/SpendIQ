{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: finpilot-postgres-secret
  labels:
    {{- include "finpilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@finpilot-postgres:5432/{{ .Values.postgresql.auth.database }}"
{{- end }}
