apiVersion: v1
kind: ConfigMap
metadata:
  name: spendiq-backend-config
  labels:
    app.kubernetes.io/component: backend
    {{- include "spendiq.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.backend.env.ENVIRONMENT | quote }}
  ALLOWED_ORIGINS: {{ .Values.backend.env.ALLOWED_ORIGINS | quote }}
  POSTGRES_HOST: "spendiq-postgres"
  POSTGRES_PORT: "5432"
