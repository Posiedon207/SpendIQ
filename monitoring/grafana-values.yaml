# Grafana Helm values
adminUser: admin
adminPassword: "spendiq_grafana_admin_password"

persistence:
  enabled: true
  size: 5Gi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 15s

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "spendiq-dashboards"
        orgId: 1
        folder: "SpendIQ"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/spendiq

dashboards:
  spendiq:
    spendiq-overview:
      file: /var/lib/grafana/dashboards/spendiq/grafana-dashboard.json

service:
  type: LoadBalancer
  port: 80
  targetPort: 3000
