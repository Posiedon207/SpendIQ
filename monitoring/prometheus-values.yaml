# Prometheus Operator / kube-prometheus-stack Helm values
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

# Additional Scrape Config for SpendIQ (if ServiceMonitor is not used)
additionalScrapeConfigs:
  - job_name: "spendiq-backend"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["spendiq-backend.spendiq.svc.cluster.local:8000"]
        labels:
          app: spendiq-backend
          environment: production
