version: "3.9"

services:
  # ─── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: finpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finpilot_db}
      POSTGRES_USER: ${POSTGRES_USER:-finpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finpilot_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finpilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finpilot} -d ${POSTGRES_DB:-finpilot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "5432:5432"

  # ─── Backend (FastAPI) ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: finpilot-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finpilot}:${POSTGRES_PASSWORD:-finpilot_secret}@db:5432/${POSTGRES_DB:-finpilot_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-finpilot_db}
      POSTGRES_USER: ${POSTGRES_USER:-finpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finpilot_secret}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finpilot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    ports:
      - "8000:8000"

  # ─── Frontend (React + Nginx) ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: finpilot-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finpilot-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "3000:80"

# ─── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: finpilot-postgres-data

# ─── Networks ────────────────────────────────────────────────────────────────
networks:
  finpilot-network:
    name: finpilot-network
    driver: bridge
